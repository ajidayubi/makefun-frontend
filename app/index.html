<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>make.fun / open board</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/" aria-label="make.fun board">make.fun<span class="brand-mark">✳</span></a>
    <nav class="primary-nav" aria-label="Primary navigation">
      <a href="#/" data-nav="board">BOARD</a>
      <a href="#/rankings" data-nav="rankings">RANKINGS</a>
    </nav>
    <form id="maker-search" class="maker-search" role="search">
      <label class="visually-hidden" for="maker-handle">Find a maker</label>
      <input id="maker-handle" name="handle" autocomplete="off" placeholder="FIND A MAKER" aria-label="Find a maker profile">
      <button type="submit" aria-label="Open maker profile">↵</button>
    </form>
    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch to light theme">LIGHT</button>
    <time id="utc-clock" class="clock" aria-label="UTC time">--:--:-- UTC</time>
  </header>
  <section id="ticker" class="ticker" aria-live="polite"><span class="ticker-dot"></span><span>CONNECTING TO MAKE.FUN API</span></section>
  <main id="app" tabindex="-1"><div class="loading">FETCHING LIVE BOARD…</div></main>
  <div id="toast" class="toast" role="status" hidden></div>
  <script type="module" src="/main.js"></script>
</body>
</html>
